name: Metrics
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: YRC99
          template: classic
          filename: metrics.svg
          output_action: none
          base: header, activity
          repositories_affiliations: owner
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          # indepth = only languages in your own commits; programming = no HTML/notebooks
          commits_authoring: YRC99, Yi Rui Cui
          plugin_languages_indepth: yes
          plugin_languages_categories: programming
          plugin_languages_sections: most-used
          plugin_languages_limit: 10
          plugin_languages_threshold: 2%
      # neutral headings instead of link-blue, then publish to the metrics branch
      - run: |
          sudo sed -i 's/color:#0366d6/color:#7d8590/' /metrics_renders/metrics.svg
          sudo cp /metrics_renders/metrics.svg "$RUNNER_TEMP/"
          git clone -q --depth 1 -b metrics "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" out
          cp "$RUNNER_TEMP/metrics.svg" out/
          cd out
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add metrics.svg
          git diff --cached --quiet || git commit -qm "Update metrics" && git push -q
